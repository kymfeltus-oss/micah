<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Mobile Preview | M.R.-Gen-C Psychiatry</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
      background: #e8efed;
      font-family: Arial, sans-serif;
    }

    .device {
      width: 410px;
      height: 864px;
      padding: 10px;
      overflow: hidden;
      border: 1px solid #273744;
      border-radius: 40px;
      background: #14232b;
      box-shadow: 0 24px 64px rgb(18 37 48 / 22%);
    }

    iframe {
      display: block;
      width: 390px;
      height: 844px;
      border: 0;
      border-radius: 29px;
      background: #f5fbf8;
    }

    @media (max-width: 450px) {
      body {
        padding: 0;
      }

      .device {
        width: 100vw;
        height: 100vh;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      iframe {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
    }

    @media (min-width: 451px) and (max-height: 910px) {
      .device {
        height: min(864px, calc(100vh - 48px));
      }

      iframe {
        height: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="device" aria-label="390 pixel wide mobile site preview">
    <iframe src="./index.html" title="M.R.-Gen-C Psychiatry mobile site"></iframe>
  </main>
</body>
</html>
