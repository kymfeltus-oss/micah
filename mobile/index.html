<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>M.R.-Gen-C Psychiatry | Mobile View</title>
  <style>
    html {
      background: #eaf1f5;
    }

    body {
      display: grid;
      min-height: 100dvh;
      margin: 0;
      place-items: center;
    }

    iframe {
      display: block;
      width: min(100%, 430px);
      height: min(100dvh, 764px);
      border: 0;
      background: #fff;
    }

    @media (max-width: 430px) {
      html {
        background: #fff;
      }

      body {
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      iframe {
        height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <iframe id="mobile-preview" title="M.R.-Gen-C Psychiatry mobile website"></iframe>
  <script>
    const preview = document.getElementById('mobile-preview');

    function showRequestedPage() {
      const site = new URL('../?view=mobile&v=mobile-approach-shell-2', location.href);
      site.hash = location.hash || 'home';
      preview.src = site.href;
    }

    addEventListener('hashchange', showRequestedPage);
    showRequestedPage();
  </script>
</body>
</html>
